<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- omni-git icon — "Railway E"
       Trunk plus one branch that diverges, runs a genuine stretch in its own
       lane, and merges back at HEAD. The parallel run is the whole point: with
       no straight section the two lanes close into a wedge and the icon reads as
       a play button instead of a graph. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b39"/>
      <stop offset="0.55" stop-color="#181c25"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Rim light: the thin bright edge every platform's stock icons have. -->
  <rect x="6" y="6" width="1012" height="1012" rx="218" fill="none" stroke="url(#rim)" stroke-width="12"/>

  <!-- Glow underlays, so the lanes sit in the background rather than on it. -->
  <g fill="none" stroke-width="104" stroke-linecap="round" opacity="0.16">
    <path d="M 352 786 C 352 690 640 700 640 604 L 640 444 C 640 348 352 358 352 262" stroke="#22c55e"/>
    <path d="M 352 190 L 352 858" stroke="#3b82f6"/>
  </g>
  <g fill="none" stroke-width="56" stroke-linecap="round">
    <path d="M 352 786 C 352 690 640 700 640 604 L 640 444 C 640 348 352 358 352 262" stroke="#22c55e"/>
    <path d="M 352 190 L 352 858" stroke="#3b82f6"/>
  </g>
  <g>
    <circle cx="640" cy="524" r="82" fill="#12151b"/><circle cx="640" cy="524" r="56" fill="#22c55e"/>
    <circle cx="352" cy="640" r="82" fill="#12151b"/><circle cx="352" cy="640" r="56" fill="#3b82f6"/>
    <circle cx="352" cy="786" r="82" fill="#12151b"/><circle cx="352" cy="786" r="56" fill="#3b82f6"/>
    <!-- HEAD, in the amber the graph uses for the checked-out commit. -->
    <circle cx="352" cy="262" r="82" fill="#12151b"/><circle cx="352" cy="262" r="56" fill="#f59e0b"/>
  </g>
</svg>
