<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- omni-git icon — "Railway F"
       Railway E with a third lane: a branch off the branch, still unmerged, so
       its lane ends in a tip instead of rejoining. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b39"/>
      <stop offset="0.55" stop-color="#181c25"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Rim light: the thin bright edge every platform's stock icons have. -->
  <rect x="6" y="6" width="1012" height="1012" rx="218" fill="none" stroke="url(#rim)" stroke-width="12"/>

  <g fill="none" stroke-width="96" stroke-linecap="round" opacity="0.15">
    <path d="M 512 556 C 512 452 724 462 724 362 L 724 300" stroke="#a855f7"/>
    <path d="M 300 790 C 300 700 512 706 512 616 L 512 478 C 512 382 300 392 300 296" stroke="#22c55e"/>
    <path d="M 300 216 L 300 862" stroke="#3b82f6"/>
  </g>
  <g fill="none" stroke-width="52" stroke-linecap="round">
    <path d="M 512 556 C 512 452 724 462 724 362 L 724 300" stroke="#a855f7"/>
    <path d="M 300 790 C 300 700 512 706 512 616 L 512 478 C 512 382 300 392 300 296" stroke="#22c55e"/>
    <path d="M 300 216 L 300 862" stroke="#3b82f6"/>
  </g>
  <g>
    <circle cx="724" cy="300" r="78" fill="#12151b"/><circle cx="724" cy="300" r="52" fill="#a855f7"/>
    <circle cx="512" cy="556" r="78" fill="#12151b"/><circle cx="512" cy="556" r="52" fill="#22c55e"/>
    <circle cx="300" cy="672" r="78" fill="#12151b"/><circle cx="300" cy="672" r="52" fill="#3b82f6"/>
    <circle cx="300" cy="790" r="78" fill="#12151b"/><circle cx="300" cy="790" r="52" fill="#3b82f6"/>
    <circle cx="300" cy="296" r="78" fill="#12151b"/><circle cx="300" cy="296" r="52" fill="#f59e0b"/>
  </g>
</svg>
