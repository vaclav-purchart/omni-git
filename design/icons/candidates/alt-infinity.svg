<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- omni-git icon — "Infinity"
       One lane that diverges and rejoins forever, with the crossing as the merge
       commit. Strongest silhouette of the set, and the only one that is a single
       unbroken stroke. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b39"/><stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="lane" gradientUnits="userSpaceOnUse" x1="200" y1="380" x2="824" y2="644">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <path d="M 512 512 C 428 366 236 366 236 512 C 236 658 428 658 512 512 C 596 366 788 366 788 512 C 788 658 596 658 512 512 Z"
        fill="none" stroke="url(#lane)" stroke-width="84" stroke-linecap="round"/>
  <circle cx="236" cy="512" r="92" fill="#12151b"/><circle cx="236" cy="512" r="60" fill="#3b82f6"/>
  <circle cx="788" cy="512" r="92" fill="#12151b"/><circle cx="788" cy="512" r="60" fill="#22c55e"/>
  <circle cx="512" cy="512" r="92" fill="#12151b"/><circle cx="512" cy="512" r="60" fill="#f59e0b"/>
</svg>
