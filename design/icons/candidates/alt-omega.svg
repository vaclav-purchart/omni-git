<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- omni-git icon — "Omega"
       The Ω of omni drawn as one continuous lane that splits into two feet, each
       ending in a commit. A letterform rather than a diagram, so it stays a mark
       at any size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b39"/><stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g fill="none" stroke="url(#lane)" stroke-width="74" stroke-linecap="round">
    <path d="M 389 626 A 215 215 0 1 1 635 626"/>
    <path d="M 389 626 C 378 726 388 780 300 780"/>
    <path d="M 635 626 C 646 726 636 780 724 780"/>
  </g>
  <circle cx="300" cy="780" r="82" fill="#12151b"/><circle cx="300" cy="780" r="54" fill="#3b82f6"/>
  <circle cx="724" cy="780" r="82" fill="#12151b"/><circle cx="724" cy="780" r="54" fill="#22c55e"/>
  <circle cx="512" cy="235" r="82" fill="#12151b"/><circle cx="512" cy="235" r="54" fill="#f59e0b"/>
</svg>
