<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- omni-git icon — "inf-tall"
       The same lemniscate with much deeper loops, so it fills the square instead of banding across the middle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b39"/><stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="lane" gradientUnits="userSpaceOnUse" x1="180" y1="300" x2="844" y2="724">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <path d="M 512 512 C 420 180 200 180 200 512 C 200 844 420 844 512 512 C 604 180 824 180 824 512 C 824 844 604 844 512 512 Z" fill="none" stroke="url(#lane)" stroke-width="88" stroke-linecap="round"/>
  <circle cx="200" cy="512" r="96" fill="#12151b"/><circle cx="200" cy="512" r="62" fill="#3b82f6"/>
  <circle cx="824" cy="512" r="96" fill="#12151b"/><circle cx="824" cy="512" r="62" fill="#22c55e"/>
  <circle cx="512" cy="512" r="96" fill="#12151b"/><circle cx="512" cy="512" r="62" fill="#f59e0b"/>
</svg>
